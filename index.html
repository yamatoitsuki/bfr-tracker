<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BFR Tray Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    --kraft:#e8dfc8;
    --kraft-dark:#d9cca4;
    --ink:#232520;
    --ink-soft:#5b5648;
    --stamp-red:#a13d2e;
    --stamp-green:#3f6b3d;
    --paper:#f6f1e2;
    --line:#c9bd97;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Courier New',ui-monospace,monospace;
    background:var(--kraft);
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 1px, transparent 1px, transparent 3px);
    color:var(--ink);
    min-height:100vh;
    padding:24px 16px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:3px double var(--ink);
    padding-bottom:14px;
    margin-bottom:22px;
    flex-wrap:wrap;
    gap:10px;
  }
  .title-block h1{
    font-family:'Arial Black', Arial, sans-serif;
    font-size:clamp(22px,4vw,32px);
    letter-spacing:1px;
    margin:0;
    text-transform:uppercase;
  }
  .title-block .sub{
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:2px;
    text-transform:uppercase;
    margin-top:4px;
  }
  .datestamp{
    font-size:12px;
    text-align:right;
    color:var(--ink-soft);
    line-height:1.6;
  }
  .datestamp .big{
    font-family:'Arial Black',Arial,sans-serif;
    font-size:15px;
    color:var(--ink);
    letter-spacing:1px;
  }

  .stats{
    display:grid;
    grid-template-columns:1fr;
    max-width:240px;
    margin-bottom:24px;
  }
  .stat{
    background:var(--paper);
    border:1px solid var(--line);
    padding:12px 14px;
    text-align:center;
  }
  .stat .n{font-family:'Arial Black',Arial,sans-serif;font-size:26px;color:var(--stamp-green);}
  .stat .l{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-soft);margin-top:2px;}

  form.addform{
    background:var(--paper);
    border:1px dashed var(--ink-soft);
    padding:16px;
    margin-bottom:28px;
    display:grid;
    grid-template-columns:1.2fr 1.4fr 1fr auto;
    gap:10px;
    align-items:end;
  }
  form.addform .field{display:flex;flex-direction:column;gap:4px;}
  form.addform label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-soft);}
  form.addform input, form.addform select{
    font-family:inherit;
    font-size:14px;
    padding:8px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
  }
  form.addform input:focus, form.addform select:focus{outline:2px solid var(--ink);outline-offset:1px;}
  .btn{
    font-family:'Arial Black',Arial,sans-serif;
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    padding:10px 16px;
    border:2px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
    white-space:nowrap;
  }
  .btn:hover{background:var(--stamp-red);border-color:var(--stamp-red);}
  .btn.secondary{background:transparent;color:var(--ink);}
  .btn.secondary:hover{background:var(--ink);color:var(--paper);}
  .btn.green:hover{background:var(--stamp-green);border-color:var(--stamp-green);}

  .searchrow{margin-bottom:18px;display:flex;gap:10px;flex-wrap:wrap;}
  .searchrow input{
    flex:1;
    min-width:180px;
    font-family:inherit;
    padding:9px 12px;
    border:1px solid var(--line);
    background:#fff;
    font-size:13px;
  }
  .searchrow select{
    font-family:inherit;
    font-size:13px;
    padding:9px 10px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
  }

  @media(max-width:760px){form.addform{grid-template-columns:1fr;}}

  .listhead{
    font-family:'Arial Black',Arial,sans-serif;
    font-size:14px;
    letter-spacing:2px;
    text-transform:uppercase;
    padding-bottom:8px;
    border-bottom:2px solid var(--stamp-green);
    color:var(--stamp-green);
    margin:0 0 12px;
    display:flex;
    justify-content:space-between;
  }

  .gappanel{
    background:var(--paper);
    border:2px solid var(--stamp-red);
    padding:14px 16px;
    margin-bottom:22px;
  }
  .gappanel.clear{border-color:var(--stamp-green);}
  .gappanel .gaphead{
    display:flex;justify-content:space-between;align-items:center;
    flex-wrap:wrap;gap:8px;margin-bottom:10px;
  }
  .gappanel h2{
    font-family:'Arial Black',Arial,sans-serif;
    font-size:14px;letter-spacing:2px;text-transform:uppercase;
    margin:0;color:var(--stamp-red);
  }
  .gappanel.clear h2{color:var(--stamp-green);}
  .gappanel .gapfrom{font-size:11px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .gappanel .gapfrom input{
    width:90px;font-family:inherit;font-size:12px;padding:5px 6px;
    border:1px solid var(--line);background:#fff;
  }
  .gappanel .gapsummary{font-size:12px;color:var(--ink-soft);margin-bottom:10px;}
  .gapchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;}
  .gapitem{background:#fff;border:1px solid var(--stamp-red);padding:6px 10px;display:flex;gap:8px;align-items:baseline;}
  .gapnum{font-family:'Arial Black',Arial,sans-serif;font-size:14px;letter-spacing:0.5px;color:var(--stamp-red);}
  .gapbody{margin-top:12px;}
  .gapbody .gapfrom{margin-bottom:10px;}
  .listpanel{margin-bottom:8px;}

  details.gappanel > summary, details.listpanel > summary{
    list-style:none;cursor:pointer;
    font-family:'Arial Black',Arial,sans-serif;
    font-size:14px;letter-spacing:2px;text-transform:uppercase;
    display:flex;justify-content:space-between;align-items:center;
  }
  details > summary::-webkit-details-marker{display:none;}
  details > summary::after{
    content:'Show \25BE';
    font-family:'Courier New',monospace;font-size:11px;letter-spacing:1px;font-weight:bold;
    border:2px solid currentColor;padding:4px 10px;flex-shrink:0;margin-left:10px;
  }
  details[open] > summary::after{content:'Hide \25B4';}
  details > summary:hover::after{opacity:0.65;}
  details.gappanel > summary{color:var(--stamp-red);}
  details.gappanel.clear > summary{color:var(--stamp-green);}
  details.listpanel > summary{
    color:var(--stamp-green);
    padding-bottom:8px;border-bottom:2px solid var(--stamp-green);margin-bottom:12px;
  }
  .gapchip{
    font-family:'Arial Black',Arial,sans-serif;
    font-size:12px;letter-spacing:0.5px;
    background:#fff;color:var(--stamp-red);
    border:1px solid var(--stamp-red);
    padding:4px 8px;
  }
  .gapchip small{font-family:'Courier New',monospace;font-size:10px;color:var(--ink-soft);margin-left:4px;}

  .rangemissing{display:none;margin:-8px 0 18px;font-size:12px;line-height:1.7;color:var(--stamp-red);}
  .rangemissing.show{display:block;}
  .rangemissing.ok{color:var(--stamp-green);}
  .rangemissing b{font-family:'Arial Black',Arial,sans-serif;letter-spacing:0.5px;}
  .gapdept{font-family:'Courier New',monospace;font-size:11px;font-weight:normal;color:var(--ink-soft);margin-left:3px;}
  .gapjumps{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:11px;color:var(--ink-soft);line-height:1.6;}
  .gapjumps b{color:var(--ink);}

  .entry{
    background:var(--paper);
    border:1px solid var(--line);
    border-left:6px solid var(--stamp-green);
    padding:12px 14px;
    margin-bottom:8px;
    display:grid;
    grid-template-columns:110px 1fr auto auto;
    gap:12px;
    align-items:center;
  }
  .entry .num{
    font-family:'Arial Black',Arial,sans-serif;
    font-size:16px;
    letter-spacing:1px;
  }
  .entry .dept{font-size:12px;color:var(--ink-soft);}
  .entry .when{font-size:11px;color:var(--ink-soft);}
  .entry .btn{padding:6px 9px;font-size:10px;}
  @media(max-width:600px){
    .entry{grid-template-columns:1fr auto;}
    .entry .dept,.entry .when{grid-column:1;}
  }

  .empty{
    font-size:12px;
    color:var(--ink-soft);
    padding:24px 10px;
    text-align:center;
    border:1px dashed var(--line);
  }

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);
    padding:10px 20px;font-size:12px;letter-spacing:1px;
    display:none;
  }
  .toast.show{display:block;}
  .loading{text-align:center;padding:40px;color:var(--ink-soft);font-size:13px;}

  .scanbox{
    background:var(--paper);
    border:2px solid var(--ink);
    padding:18px;
    margin-bottom:22px;
  }
  .scanbox h2{
    font-family:'Arial Black',Arial,sans-serif;
    font-size:14px;letter-spacing:2px;text-transform:uppercase;
    margin:0 0 12px;
  }

  .dropzone{
    border:2px dashed var(--ink-soft);
    padding:26px;
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    cursor:pointer;
    background:#fdfbf3;
  }
  .dropzone:hover{border-color:var(--ink);}
  .dropzone.drag{border-color:var(--stamp-green);background:#eef3ea;}
  .dropzone input{display:none;}

  .scanprogress{margin-top:14px;}
  .progitem{
    display:flex;justify-content:space-between;align-items:center;
    font-size:12px;padding:6px 0;border-bottom:1px solid var(--line);
  }
  .progitem .status{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);}
  .progitem .status.done{color:var(--stamp-green);}
  .progitem .status.busy{color:var(--stamp-red);}

  .reviewtable{margin-top:16px;}
  .reviewrow{
    display:grid;
    grid-template-columns:1.1fr 1.3fr 1fr auto;
    gap:10px;
    align-items:center;
    background:#fff;
    border:1px solid var(--line);
    padding:10px 12px;
    margin-bottom:8px;
    font-size:12px;
  }
  .reviewrow.dupe{border-left:4px solid var(--stamp-red);}
  .reviewrow input{
    font-family:inherit;font-size:12px;padding:6px;border:1px solid var(--line);width:100%;
  }
  .reviewrow .snippet{font-size:10px;color:var(--ink-soft);grid-column:1/-1;margin-top:4px;font-style:italic;}
  .reviewactions{margin-top:14px;display:flex;gap:10px;justify-content:flex-end;}
  @media(max-width:700px){.reviewrow{grid-template-columns:1fr;}}

  .authbar{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .authbtn{
    font-family:'Arial Black',Arial,sans-serif;
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
    padding:6px 12px;
    border:1px solid var(--ink);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
  }
  .authbtn:hover{background:var(--ink);color:var(--paper);}

  .adminbadge,.viewerbadge{
    font-family:'Arial Black',Arial,sans-serif;
    font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
    padding:4px 8px;
  }
  .adminbadge{color:var(--stamp-green);border:1px solid var(--stamp-green);}
  .viewerbadge{color:var(--ink-soft);border:1px solid var(--ink-soft);}

  .loginpanel{
    background:var(--paper);
    border:2px solid var(--ink);
    padding:16px;
    margin:0 auto 22px;
    display:none;
    max-width:320px;
  }
  .loginpanel.show{display:block;}
  .loginpanel h3{
    font-family:'Arial Black',Arial,sans-serif;
    font-size:12px;letter-spacing:1.5px;text-transform:uppercase;
    margin:0 0 10px;
  }
  .loginpanel input{
    width:100%;
    font-family:inherit;
    font-size:14px;
    padding:8px;
    border:1px solid var(--line);
    margin-bottom:8px;
    box-sizing:border-box;
  }
  .loginpanel .err{font-size:11px;color:var(--stamp-red);margin-bottom:8px;display:none;}
  .loginpanel .err.show{display:block;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-block">
      <h1>BFR Tray Tracker</h1>
      <div class="sub">Scan Log</div>
    </div>
    <div class="authbar">
      <div class="datestamp">
        <div class="big" id="todayLabel">—</div>
      </div>
      <span id="authBadge"></span>
      <button class="authbtn" id="authToggleBtn">Admin Login</button>
    </div>
  </header>

  <div class="loginpanel" id="loginPanel">
    <h3>Admin login</h3>
    <div class="err" id="loginErr">Incorrect password. Try again.</div>
    <input type="password" id="loginPassword" placeholder="Enter admin password">
    <div style="display:flex;gap:8px;">
      <button class="btn" id="loginSubmit" style="flex:1;">Unlock</button>
      <button class="btn secondary" id="loginCancel">Cancel</button>
    </div>
  </div>

  <div id="loading" class="loading">Loading log…</div>

  <div id="app" style="display:none;">
    <div class="stats">
      <div class="stat">
        <div class="n" id="statTotal">0</div>
        <div class="l">BFRs Scanned</div>
      </div>
    </div>

    <div id="adminControls" style="display:none;">
    <div class="scanbox">
      <h2>Bulk Scan &amp; Auto-Extract</h2>
      <div class="dropzone" id="dropzone">
        <div id="dropzoneLabel">Drop BFR images or PDFs here, or click to choose files<br><span style="font-size:10px;">Accepts multiple files at once — JPG, PNG, PDF</span></div>
        <input type="file" id="fileInput" accept="image/*,.pdf" multiple>
      </div>
      <div class="scanprogress" id="scanProgress"></div>
      <div class="reviewtable" id="reviewTable"></div>
      <div class="reviewactions" id="reviewActions" style="display:none;">
        <button class="btn secondary" id="discardScan">Discard</button>
        <button class="btn green" id="confirmScan">Confirm &amp; Add to Log</button>
      </div>
    </div>

    <form class="addform" id="addForm">
      <div class="field">
        <label for="bfrNum">BFR Number</label>
        <input id="bfrNum" type="text" placeholder="e.g. 0231" required>
      </div>
      <div class="field">
        <label for="bfrDept">Department</label>
        <select id="bfrDept">
          <option value="">— Select —</option>
          <option value="ACMV">ACMV</option>
          <option value="BUILDING">BUILDING</option>
          <option value="MECHANICAL">MECHANICAL</option>
          <option value="ELECTRICAL">ELECTRICAL</option>
          <option value="OTIS">OTIS</option>
        </select>
      </div>
      <div class="field">
        <label for="bfrDate">Date Scanned</label>
        <input id="bfrDate" type="date" required>
      </div>
      <button type="submit" class="btn">+ Log BFR</button>
    </form>
    </div>

    <div class="searchrow">
      <input type="text" id="search" placeholder="Search BFR number, department, or range e.g. 4556-4652">
      <select id="deptFilter">
        <option value="ALL">All departments</option>
        <option value="ACMV">ACMV</option>
        <option value="BUILDING">BUILDING</option>
        <option value="MECHANICAL">MECHANICAL</option>
        <option value="ELECTRICAL">ELECTRICAL</option>
        <option value="OTIS">OTIS</option>
      </select>
      <button class="btn secondary" id="clearSearch">Clear</button>
    </div>
    <div class="rangemissing" id="rangeMissing"></div>

    <details class="gappanel" id="gapPanel">
      <summary><span id="gapTitle">Missing BFRs (0)</span></summary>
      <div class="gapbody">
        <label class="gapfrom">Check from BFR
          <input type="text" id="gapFrom" inputmode="numeric" placeholder="lowest">
        </label>
        <div class="gapsummary" id="gapSummary"></div>
        <div class="gapchips" id="gapChips"></div>
      </div>
    </details>

    <details class="listpanel">
      <summary>Scanned BFRs <span id="listCount">(0/0)</span></summary>
      <div id="bfrList"></div>
    </details>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ---------- Firebase Config ----------
const firebaseConfig = {
  apiKey: "AIzaSyDL9fPfm9ZcWFzUZAhzRe75UC7Kv2lr2uU",
  authDomain: "bfr-tracker.firebaseapp.com",
  projectId: "bfr-tracker",
  storageBucket: "bfr-tracker.firebasestorage.app",
  messagingSenderId: "291923466374",
  appId: "1:291923466374:web:68ba62def5f988afa4d907"
};
const ADMIN_EMAIL = "admin@bfrtracker.local";

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const recordsDocRef = db.collection('bfrtracker').doc('records');

let records = [];
let isAdmin = false;
let unsubscribeRecords = null;

function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function fmtDate(s){
  if(!s) return '—';
  const d = new Date(s+'T00:00:00');
  return d.toLocaleDateString('en-SG',{day:'2-digit',month:'short',year:'numeric'});
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}
function uid(){
  return 'r'+Date.now()+Math.random().toString(36).slice(2,7);
}
function stripBfrPrefix(s){
  return (s||'').replace(/^BFR[\s\-#]*/i,'').trim() || (s||'');
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Existing records keep their original fields. The date shown is whichever
// scan date the record has (out-scan date first, then in-scan date).
function scanDateOf(r){
  return r.scannedOutDate || r.scannedInDate || '';
}

// Live sync — anyone can read; only a logged-in admin can write.
function subscribeToRecords(onFirstLoad){
  let firstLoadDone = false;
  return recordsDocRef.onSnapshot((snap)=>{
    const data = snap.exists ? snap.data() : null;
    records = (data && Array.isArray(data.data)) ? data.data : [];
    if(!firstLoadDone){
      firstLoadDone = true;
      if(onFirstLoad) onFirstLoad();
    }
    render();
  }, (err)=>{
    console.error('Firestore sync error:', err);
    showToast('Sync error — check connection');
    if(!firstLoadDone){
      firstLoadDone = true;
      if(onFirstLoad) onFirstLoad();
    }
  });
}

async function saveRecords(){
  try{
    await recordsDocRef.set({ data: records });
  }catch(e){
    console.error(e);
    showToast('Save failed — check connection or login');
  }
}

// ---------- Range search (e.g. 4556-4652) ----------
function recNum(r){
  const t = stripBfrPrefix(r.bfrNumber||'').trim();
  return /^\d+$/.test(t) ? parseInt(t,10) : null;
}
function parseRange(q){
  const m = (q||'').match(/^\s*(\d+)\s*(?:-|–|—|to)\s*(\d+)\s*$/i);
  if(!m) return null;
  let lo = parseInt(m[1],10), hi = parseInt(m[2],10);
  if(lo > hi) [lo,hi] = [hi,lo];
  return {lo, hi};
}
// Missing numbers inside [lo,hi], returned as runs of consecutive numbers.
function missingInRange(lo, hi){
  const have = new Set();
  records.forEach(r=>{ const n = recNum(r); if(n !== null) have.add(n); });
  const runs = [];
  let count = 0;
  for(let n=lo; n<=hi; n++){
    if(have.has(n)) continue;
    count++;
    const last = runs[runs.length-1];
    if(last && last.end === n-1) last.end = n; else runs.push({start:n, end:n});
  }
  return {runs, count};
}
function renderRangeMissing(range){
  const box = document.getElementById('rangeMissing');
  if(!range){ box.className = 'rangemissing'; box.innerHTML = ''; return; }
  const label = `${range.lo}–${range.hi}`;
  if(range.hi - range.lo > 20000){
    box.className = 'rangemissing show';
    box.textContent = 'Range too large. Use a smaller range.';
    return;
  }
  const {runs, count} = missingInRange(range.lo, range.hi);
  if(!count){
    box.className = 'rangemissing show ok';
    box.textContent = `No missing numbers in ${label}.`;
    return;
  }
  const CAP = 100;
  const text = runs.slice(0, CAP).map(r=> r.start === r.end ? `${r.start}` : `${r.start}–${r.end}`).join(', ');
  const more = runs.length > CAP ? `, and ${runs.length - CAP} more` : '';
  box.className = 'rangemissing show';
  box.innerHTML = `<b>Missing in ${label} (${count}):</b> ${text}${more}`;
}

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const range = parseRange(q);
  const dept = document.getElementById('deptFilter').value;

  const items = records
    .map((r,i)=>({r,i}))
    .filter(({r})=>{
      if(dept !== 'ALL' && (r.department||'').toUpperCase() !== dept) return false;
      if(!q) return true;
      if(range){
        const n = recNum(r);
        return n !== null && n >= range.lo && n <= range.hi;
      }
      return (r.bfrNumber||'').toLowerCase().includes(q) || (r.department||'').toLowerCase().includes(q);
    })
    .sort((a,b)=>{
      if(range) return (recNum(a.r)||0) - (recNum(b.r)||0);
      const c = scanDateOf(b.r).localeCompare(scanDateOf(a.r));
      return c !== 0 ? c : b.i - a.i;
    })
    .map(x=>x.r);

  document.getElementById('listCount').textContent = '('+items.length+'/'+records.length+')';
  document.getElementById('statTotal').textContent = records.length;
  renderGaps();
  renderRangeMissing(range);

  document.getElementById('bfrList').innerHTML = items.length ? items.map(r=>`
    <div class="entry">
      <div class="num">${escapeHtml(stripBfrPrefix(r.bfrNumber))}</div>
      <div class="dept">${escapeHtml(r.department||'No department noted')}</div>
      <div class="when">Scanned: ${fmtDate(scanDateOf(r))}</div>
      ${isAdmin ? `<button class="btn secondary" data-action="delete" data-id="${r.id}">Delete</button>` : ''}
    </div>
  `).join('') : `<div class="empty">${records.length ? 'No BFRs match this search.' : 'No BFRs logged yet. Scan or add one above.'}</div>`;
}

// ---------- Missing number detection ----------
// BFR numbers are running numbers. Anything between the lowest and highest
// logged number that isn't in the log is shown as missing (i.e. not scanned yet).
try{ document.getElementById('gapFrom').value = localStorage.getItem('bfrGapFrom') || ''; }catch(e){}
document.getElementById('gapFrom').addEventListener('input', (e)=>{
  try{ localStorage.setItem('bfrGapFrom', e.target.value.trim()); }catch(err){}
  renderGaps();
});

function renderGaps(){
  const MAX_GAP = 20; // a gap longer than this is treated as a jump (old or misread entry), not missing BFRs
  const panel = document.getElementById('gapPanel');
  const title = document.getElementById('gapTitle');
  const summary = document.getElementById('gapSummary');
  const chips = document.getElementById('gapChips');

  const strs = [];
  const deptByNum = new Map();
  let skipped = 0;
  records.forEach(r=>{
    const str = stripBfrPrefix(r.bfrNumber||'').trim();
    if(!/^\d+$/.test(str)){ skipped++; return; }
    strs.push(str);
    const n = parseInt(str,10);
    if(!deptByNum.get(n)) deptByNum.set(n, (r.department||'').toUpperCase());
  });

  const fromVal = parseInt(document.getElementById('gapFrom').value.trim(), 10);
  const hasFrom = !isNaN(fromVal);
  const nums = Array.from(deptByNum.keys()).filter(n=>!hasFrom || n >= fromVal).sort((a,b)=>a-b);

  // Keep leading zeros (e.g. 0231) when the BFR numbers use them.
  const width = strs.some(x=>x.length>1 && x[0]==='0') ? Math.max(...strs.map(x=>x.length)) : 0;
  const fmt = n => width ? String(n).padStart(width,'0') : String(n);

  const skipNote = skipped ? ` ${skipped} non-numeric entr${skipped===1?'y':'ies'} skipped.` : '';

  if(nums.length < 2){
    panel.className = 'gappanel clear';
    title.textContent = 'Missing BFRs (0)';
    summary.textContent = 'Log at least two BFR numbers to check for gaps.' + skipNote;
    chips.innerHTML = '';
    removeJumps();
    return;
  }

  const gaps = [];
  const jumps = [];
  let missing = 0;
  for(let i=1;i<nums.length;i++){
    const diff = nums[i] - nums[i-1];
    if(diff > 1){
      const g = {start:nums[i-1]+1, end:nums[i]-1, prev:nums[i-1], next:nums[i], count:diff-1};
      if(g.count > MAX_GAP){ jumps.push(g); }
      else { gaps.push(g); missing += g.count; }
    }
  }

  const rangeText = `${fmt(nums[0])} to ${fmt(nums[nums.length-1])}`;

  if(!missing){
    panel.className = 'gappanel clear';
    title.textContent = 'Missing BFRs (0)';
    summary.textContent = `No small gaps between ${rangeText}.` + skipNote;
    chips.innerHTML = '';
  } else {
    panel.className = 'gappanel';
    title.textContent = `Missing BFRs (${missing})`;
    summary.textContent = `Not in the log, between ${rangeText}.` + skipNote;
    chips.innerHTML = gaps.map(g=>{
      const label = g.start === g.end ? fmt(g.start) : `${fmt(g.start)}–${fmt(g.end)}`;
      return `<div class="gapitem"><span class="gapnum">${label}</span></div>`;
    }).join('');
  }

  removeJumps();
  if(jumps.length){
    const div = document.createElement('div');
    div.className = 'gapjumps';
    div.id = 'gapJumps';
    div.innerHTML = `<b>Large jumps, not counted as missing</b> (more than ${MAX_GAP} numbers apart, usually an old or misread entry):<br>` +
      jumps.map(j=>`${fmt(j.prev)} → ${fmt(j.next)} (${j.count.toLocaleString('en-SG')} apart)`).join('<br>');
    document.querySelector('#gapPanel .gapbody').appendChild(div);
  }
}
function removeJumps(){
  const old = document.getElementById('gapJumps');
  if(old) old.remove();
}

document.getElementById('addForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  if(!isAdmin) return;
  const num = document.getElementById('bfrNum').value.trim();
  const dept = document.getElementById('bfrDept').value;
  const date = document.getElementById('bfrDate').value || todayStr();
  if(!num) return;
  records.push({id:uid(), bfrNumber:num, department:dept, scannedOutDate:date, scannedInDate:null});
  await saveRecords();
  document.getElementById('bfrNum').value='';
  document.getElementById('bfrDept').value='';
  document.getElementById('bfrDate').value = todayStr();
  render();
  showToast('BFR logged');
  document.getElementById('bfrNum').focus();
});

document.getElementById('search').addEventListener('input', render);
document.getElementById('deptFilter').addEventListener('change', render);
document.getElementById('clearSearch').addEventListener('click', ()=>{
  document.getElementById('search').value='';
  document.getElementById('deptFilter').value='ALL';
  render();
});

document.addEventListener('click', async (e)=>{
  const btn = e.target.closest('button[data-action]');
  if(!btn || !isAdmin) return;
  const id = btn.dataset.id;
  const rec = records.find(r=>r.id===id);
  if(!rec) return;
  if(btn.dataset.action==='delete'){
    if(confirm('Delete BFR '+rec.bfrNumber+' from the log? This cannot be undone.')){
      records = records.filter(r=>r.id!==id);
      await saveRecords();
      render();
      showToast('Entry deleted');
    }
  }
});

// ---------- Bulk Scan & OCR ----------
let reviewItems = [];

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
dropzone.addEventListener('click', ()=>fileInput.click());
dropzone.addEventListener('dragover', (e)=>{e.preventDefault();dropzone.classList.add('drag');});
dropzone.addEventListener('dragleave', ()=>dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', (e)=>{
  e.preventDefault();
  dropzone.classList.remove('drag');
  handleFiles(Array.from(e.dataTransfer.files));
});
fileInput.addEventListener('change', (e)=>{
  handleFiles(Array.from(e.target.files));
  fileInput.value = '';
});

const DEPARTMENTS = ['ACMV','BUILDING','MECHANICAL','ELECTRICAL','OTIS'];

function extractBfrNumber(text){
  const patterns = [
    /BFR[\s#\-\/:]*([A-Z0-9][A-Z0-9\-\/]{2,14})/i,
    /(?:BFR\s*No\.?|Report\s*No\.?|Fault\s*Report\s*No\.?)\s*[:\-]?\s*([A-Z0-9][A-Z0-9\-\/]{2,14})/i
  ];
  for(const p of patterns){
    const m = text.match(p);
    if(m && m[1]) return m[1].replace(/^BFR[-\s]?/i,'').trim();
  }
  return '';
}
function extractDepartment(text){
  // Anchor to the "Maintenance Group" field — the trade group that does the repair.
  const idx = text.search(/Maintenance\s*Group/i);
  const scope = idx !== -1 ? text.slice(idx, idx + 60) : text;
  const upper = scope.toUpperCase();
  for(const d of DEPARTMENTS){
    if(upper.includes(d)) return d;
  }
  return '';
}

async function ocrImageSource(imgSource){
  const result = await Tesseract.recognize(imgSource, 'eng');
  return result.data.text || '';
}

async function pdfPagesToImages(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  const canvases = [];
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({scale:2});
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({canvasContext:canvas.getContext('2d'), viewport}).promise;
    canvases.push(canvas);
  }
  return canvases;
}

function setProgress(label, status, cls){
  const box = document.getElementById('scanProgress');
  let row = box.querySelector('[data-label="'+label+'"]');
  if(!row){
    row = document.createElement('div');
    row.className = 'progitem';
    row.dataset.label = label;
    row.innerHTML = `<span>${escapeHtml(label)}</span><span class="status"></span>`;
    box.appendChild(row);
  }
  const s = row.querySelector('.status');
  s.textContent = status;
  s.className = 'status '+(cls||'');
}

async function handleFiles(files){
  if(!files.length) return;
  document.getElementById('scanProgress').innerHTML = '';
  reviewItems = [];
  document.getElementById('reviewTable').innerHTML = '';
  document.getElementById('reviewActions').style.display = 'none';

  for(const file of files){
    setProgress(file.name, 'Reading…', 'busy');
    try{
      let texts = [];
      if(file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')){
        const canvases = await pdfPagesToImages(file);
        for(let i=0;i<canvases.length;i++){
          setProgress(file.name, `OCR page ${i+1}/${canvases.length}…`, 'busy');
          const t = await ocrImageSource(canvases[i]);
          texts.push(t);
        }
      } else {
        setProgress(file.name, 'Running OCR…', 'busy');
        const t = await ocrImageSource(file);
        texts.push(t);
      }

      texts.forEach((text, idx)=>{
        const bfr = extractBfrNumber(text);
        const dept = extractDepartment(text);
        reviewItems.push({
          source: file.name + (texts.length>1 ? ' (page '+(idx+1)+')' : ''),
          bfrNumber: bfr,
          department: dept,
          snippet: text.replace(/\s+/g,' ').trim().slice(0,140)
        });
      });
      setProgress(file.name, 'Done', 'done');
    }catch(err){
      setProgress(file.name, 'Failed to read', 'busy');
    }
  }
  renderReview();
}

function renderReview(){
  const box = document.getElementById('reviewTable');
  if(!reviewItems.length){
    box.innerHTML = '';
    document.getElementById('reviewActions').style.display = 'none';
    return;
  }
  box.innerHTML = reviewItems.map((it,i)=>{
    const isDupe = it.bfrNumber && records.some(r=>(r.bfrNumber||'').toLowerCase()===it.bfrNumber.toLowerCase());
    return `
    <div class="reviewrow ${isDupe?'dupe':''}" data-idx="${i}">
      <input type="text" class="rv-bfr" value="${escapeHtml(it.bfrNumber)}" placeholder="BFR number">
      <select class="rv-dept">
        <option value="">— Select —</option>
        ${DEPARTMENTS.map(d=>`<option value="${d}" ${it.department===d?'selected':''}>${d}</option>`).join('')}
      </select>
      <div style="font-size:10px;color:var(--ink-soft);">${escapeHtml(it.source)}${isDupe?'<br>⚠ Already in the log':''}</div>
      <button class="btn secondary rv-remove" data-idx="${i}" style="padding:6px 10px;font-size:10px;">Remove</button>
      <div class="snippet">OCR read: "${escapeHtml(it.snippet)}…"</div>
    </div>`;
  }).join('');
  document.getElementById('reviewActions').style.display = 'flex';

  box.querySelectorAll('.rv-bfr').forEach((inp,i)=>inp.addEventListener('change',()=>{reviewItems[i].bfrNumber=inp.value; renderReview();}));
  box.querySelectorAll('.rv-dept').forEach((sel,i)=>sel.addEventListener('change',()=>{reviewItems[i].department=sel.value;}));
  box.querySelectorAll('.rv-remove').forEach(btn=>btn.addEventListener('click',()=>{
    reviewItems.splice(parseInt(btn.dataset.idx),1);
    renderReview();
  }));
}

function clearScanArea(){
  reviewItems = [];
  document.getElementById('reviewTable').innerHTML = '';
  document.getElementById('scanProgress').innerHTML = '';
  document.getElementById('reviewActions').style.display = 'none';
}

document.getElementById('discardScan').addEventListener('click', clearScanArea);

document.getElementById('confirmScan').addEventListener('click', async ()=>{
  if(!isAdmin) return;
  let added = 0;
  for(const it of reviewItems){
    if(!it.bfrNumber) continue;
    records.push({id:uid(), bfrNumber:it.bfrNumber, department:it.department, scannedOutDate:todayStr(), scannedInDate:null});
    added++;
  }
  await saveRecords();
  clearScanArea();
  render();
  showToast(`${added} BFR${added===1?'':'s'} added to log`);
});

// ---------- Login (Firebase Authentication) ----------
function showLoginPanel(){
  document.getElementById('loginPanel').classList.add('show');
  document.getElementById('loginErr').classList.remove('show');
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginPassword').focus();
}
function hideLoginPanel(){
  document.getElementById('loginPanel').classList.remove('show');
}

document.getElementById('authToggleBtn').addEventListener('click', ()=>{
  if(isAdmin){
    auth.signOut();
    showToast('Logged out — view only');
  } else {
    showLoginPanel();
  }
});
document.getElementById('loginCancel').addEventListener('click', hideLoginPanel);

document.getElementById('loginSubmit').addEventListener('click', attemptLogin);
document.getElementById('loginPassword').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') attemptLogin();
});

async function attemptLogin(){
  const pw = document.getElementById('loginPassword').value;
  const submitBtn = document.getElementById('loginSubmit');
  const errBox = document.getElementById('loginErr');
  errBox.classList.remove('show');
  submitBtn.textContent = 'Checking…';
  submitBtn.disabled = true;
  try{
    await auth.signInWithEmailAndPassword(ADMIN_EMAIL, pw);
  }catch(err){
    errBox.textContent = err.code === 'auth/too-many-requests'
      ? 'Too many attempts. Wait a few minutes and try again.'
      : 'Incorrect password. Try again.';
    errBox.classList.add('show');
  }
  submitBtn.textContent = 'Unlock';
  submitBtn.disabled = false;
}

// Anyone can view. Login only unlocks scanning, adding and deleting.
auth.onAuthStateChanged((user)=>{
  isAdmin = !!user;
  const toggleBtn = document.getElementById('authToggleBtn');
  const badge = document.getElementById('authBadge');
  const adminControls = document.getElementById('adminControls');
  if(isAdmin){
    hideLoginPanel();
    badge.innerHTML = '<span class="adminbadge">Admin</span>';
    toggleBtn.textContent = 'Logout';
    adminControls.style.display = 'block';
  } else {
    badge.innerHTML = '<span class="viewerbadge">View only</span>';
    toggleBtn.textContent = 'Admin Login';
    adminControls.style.display = 'none';
    clearScanArea();
  }
  render();
});

(function init(){
  document.getElementById('bfrDate').value = todayStr();
  const today = new Date();
  document.getElementById('todayLabel').textContent = today.toLocaleDateString('en-SG',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
  subscribeToRecords(()=>{
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='block';
  });
})();
</script>
